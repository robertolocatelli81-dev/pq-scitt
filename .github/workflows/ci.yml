name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
# a newer push to a trial branch (ci-prova-*) stops the run it supersedes; on any other branch every run completes
concurrency:
  group: ci-${{ github.ref }}-${{ startsWith(github.ref_name, 'ci-prova-') && 'trial' || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.ref_name, 'ci-prova-') }}
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }}, slh ${{ matrix.slh }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        slh: ["with", "without"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (hash-pinned)
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps .
      - name: Without the optional slh-dsa (the "slh" extra), checked
        if: matrix.slh == 'without'
        shell: bash
        run: |
          python -m pip uninstall -y slh-dsa
          python -c 'import importlib.util, sys; sys.exit(importlib.util.find_spec("slhdsa") is not None)'
      # Real KMS backends for tests/test_kms_reali.py (0.1.1): installed on every runner, and there they must run
      # (PQ_REQUIRE_KMS=1: a missing service fails the job). Transit server: the official OpenBao 2.7.3 binary
      # (MPL-2.0; HashiCorp Vault is BUSL-1.1 since 1.15), run natively on the three systems, sha256 pinned from
      # its checksums.txt, whose GPG signature (key 66D1 5FDD 8728 7219 C8E1 5478 D200 CD70 2853 E6D0) was checked
      # on 2026-11-24. HSM: SoftHSM2 + OpenSC pkcs11-tool; Ubuntu packages (pinned), Homebrew (not pinnable, version
      # printed), Windows built from the SoftHSMv2 2.7.0 commit (no Windows binary from the project) + OpenSC MSI.
      - name: OpenBao 2.7.3 (official binary, sha256 checked)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   a=openbao_2.7.3_linux_amd64.tar.gz;  h=131df9a21cf3dd2dff47107110b369c9974cbdaa482bcbc723b81b3403c68ecd ;;
            macOS)   a=openbao_2.7.3_darwin_arm64.tar.gz; h=1189f85499b36c0134e8e6bf0bffe71dfe1b085ab5d223324a5bccc2a59d62f7 ;;
            Windows) a=openbao_2.7.3_windows_amd64.zip;   h=969e4872b21eeee7c9b4cd312e77027e624528ca7bc9dc2361311b97e34e6e90 ;;
          esac
          curl -sSfL -o "$RUNNER_TEMP/$a" "https://github.com/openbao/openbao/releases/download/v2.7.3/$a"
          python - "$RUNNER_TEMP/$a" "$h" "$RUNNER_TEMP/bao" <<'PY'
          import hashlib, os, sys, tarfile, zipfile
          f, h, d = sys.argv[1:]
          got = hashlib.sha256(open(f, "rb").read()).hexdigest()
          if got != h:
              sys.exit("sha256 of %s: %s, expected %s" % (f, got, h))
          os.makedirs(d, exist_ok=True)
          nome = "bao.exe" if f.endswith(".zip") else "bao"
          if f.endswith(".zip"):
              with zipfile.ZipFile(f) as z:
                  open(os.path.join(d, nome), "wb").write(z.read(nome))
          else:
              with tarfile.open(f) as t:
                  open(os.path.join(d, nome), "wb").write(t.extractfile(nome).read())
          os.chmod(os.path.join(d, nome), 0o755)
          PY
          b="$RUNNER_TEMP/bao/bao"; [ "$RUNNER_OS" = Windows ] && b="$b.exe"
          "$b" version
          echo "PQ_BAO_BIN=$b" >> "$GITHUB_ENV"
          echo "PQ_REQUIRE_KMS=1" >> "$GITHUB_ENV"
      - name: SoftHSM2 and OpenSC (Linux, Ubuntu packages pinned)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq softhsm2=2.6.1-2.2ubuntu3 softhsm2-common=2.6.1-2.2ubuntu3 \
            libsofthsm2=2.6.1-2.2ubuntu3 opensc=0.25.0~rc1-1ubuntu0.2 opensc-pkcs11=0.25.0~rc1-1ubuntu0.2
          dpkg-query -W softhsm2 opensc
      - name: SoftHSM2 and OpenSC (macOS, Homebrew; Homebrew installs the current formula, a version cannot be pinned)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install softhsm opensc
          brew list --versions softhsm opensc
      - name: Cache of SoftHSM2 built for Windows (key = SoftHSMv2 commit, runner image, build options)
        if: runner.os == 'Windows'
        id: softhsm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/softhsm
          key: softhsm2-13e6e86b83748fef74046dbf0c91f664b7acc1c3-windows-2025-x64-openssl-eddsa-v2
      - name: SoftHSM2 2.7.0 from source (Windows, commit 13e6e86b, vcpkg OpenSSL)
        if: runner.os == 'Windows' && steps.softhsm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          src="$RUNNER_TEMP/softhsm-src"; out="$RUNNER_TEMP/softhsm"; vcpkg="$VCPKG_INSTALLATION_ROOT"
          git init -q "$src" && git -C "$src" fetch -q --depth 1 https://github.com/softhsm/SoftHSMv2 13e6e86b83748fef74046dbf0c91f664b7acc1c3
          git -C "$src" checkout -q FETCH_HEAD
          "$vcpkg/vcpkg" install openssl:x64-windows
          cmake -S "$src" -B "$src/build" -A x64 -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DWITH_CRYPTO_BACKEND=openssl -DENABLE_EDDSA=ON -DDISABLE_NON_PAGED_MEMORY=ON -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$out"
          cmake --build "$src/build" --config Release
          cmake --install "$src/build" --config Release
          # the OpenSSL DLLs next to the module: Windows looks for a DLL's dependencies in its own folder
          m=$(find "$out" -iname 'softhsm2*.dll' | head -1)
          cp "$vcpkg"/installed/x64-windows/bin/*.dll "$(dirname "$m")/"
          find "$out" -iname '*.dll'
      - name: SoftHSM2 module and OpenSC 0.27.1 MSI (Windows, sha256 checked)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          m=$(find "$RUNNER_TEMP/softhsm" -iname 'softhsm2*.dll' | head -1)
          [ -n "$m" ] || { echo "softhsm2 DLL not found"; exit 1; }
          echo "PQ_SOFTHSM_MODULE=$(cygpath -w "$m")" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$(dirname "$m")")" >> "$GITHUB_PATH"
          f="$RUNNER_TEMP/OpenSC-0.27.1_x64.msi"
          curl -sSfL -o "$f" https://github.com/OpenSC/OpenSC/releases/download/0.27.1/OpenSC-0.27.1_x64.msi
          echo "88ea45e848063ff5f3594a457b7f023223472eae9c9c543f8035f7689bb7b319  $f" | sha256sum -c -
          powershell -NoProfile -Command "\$p = Start-Process msiexec -ArgumentList '/i','$(cygpath -w "$f")','/qn','/norestart' -Wait -PassThru; exit \$p.ExitCode"
          echo 'C:\Program Files\OpenSC Project\OpenSC\tools' >> "$GITHUB_PATH"
      - name: pkcs11-tool and the SoftHSM2 module are found
        shell: bash
        run: |
          pkcs11-tool --version 2>&1 | head -2 || true
          command -v pkcs11-tool
      - name: Install gitleaks 8.30.1 (sha256 checked)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks && rm gitleaks.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: File list, imports, deny-list, secrets (repository content, checked on Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python check_tree.py
          python check_tree.py --positive-control
      - name: Positive control of PQ_REQUIRE_KMS (a required HSM that is missing must fail)
        shell: bash
        run: |
          cd tests
          if PQ_SOFTHSM_MODULE=/nonexistent python -B -m unittest test_kms_reali.TestSoftHsmReale; then
            echo "PQ_REQUIRE_KMS did not turn a missing HSM into a failure"; exit 1
          fi
      - name: Tests (against the installed package)
        shell: bash
        run: |
          cd tests
          python -c 'import pq_scitt, sys; assert "site-packages" in pq_scitt.__file__, pq_scitt.__file__; print(pq_scitt.__file__)'
          python -B -m unittest -v test_verify_ledger_full test_scitt test_anchor_slhdsa_fips205 test_kms_reali test_kms_http test_wycheproof_ed25519 test_cli test_readme_example test_strict_json test_secrets 2>&1 | tee unittest.log
          # every skip with its reason, counted; POSIX sh is on every runner (Git Bash on Windows): it must not skip
          grep -o "skipped '.*'" unittest.log | sort | uniq -c || true
          if grep -q "skipped 'no POSIX sh" unittest.log; then echo "sh is missing on this runner"; exit 1; fi
          python -B test_verify_ledger.py
