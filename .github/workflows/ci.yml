name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }}, slh ${{ matrix.slh }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        slh: ["with", "without"]
        include:
          - {os: macos-15, python: "3.13", slh: "with"}
          - {os: macos-15, python: "3.13", slh: "without"}
          - {os: windows-2025, python: "3.13", slh: "with"}
          - {os: windows-2025, python: "3.13", slh: "without"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (hash-pinned)
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps .
      - name: Without the optional slh-dsa (the "slh" extra), checked
        if: matrix.slh == 'without'
        shell: bash
        run: |
          python -m pip uninstall -y slh-dsa
          python -c 'import importlib.util, sys; sys.exit(importlib.util.find_spec("slhdsa") is not None)'
      # Real KMS backends for tests/test_kms_reali.py (0.1.1): they run, never skip, where installed (PQ_REQUIRE_KMS).
      # Linux: SoftHSM2 + OpenSC (Ubuntu packages) and OpenBao (MPL-2.0; HashiCorp Vault is BUSL-1.1 since 1.15) in
      # docker, pinned by digest. macOS: SoftHSM2 + OpenSC from Homebrew; no container runtime on the macOS runners.
      # Windows: no SoftHSM2 build from its project (opendnssec/SoftHSMv2 publishes sources only; the one binary
      # build, disig/SoftHSM2-for-Windows, is 2.5.0 of 2018) and the runner's docker runs Windows containers only.
      - name: Install SoftHSM2, OpenSC and the OpenBao image (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq softhsm2 opensc
          docker pull ghcr.io/openbao/openbao@sha256:ba4b133eb9586630024e71a617e66f37f29cc3534cdd46a6233e098ceded8dc9
          echo "PQ_REQUIRE_KMS=hsm vault" >> "$GITHUB_ENV"
          echo "PQ_CONTAINER=docker" >> "$GITHUB_ENV"
      - name: Install SoftHSM2 and OpenSC (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install softhsm opensc
          echo "PQ_REQUIRE_KMS=hsm" >> "$GITHUB_ENV"
      - name: Install gitleaks 8.30.1 (sha256 checked)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks && rm gitleaks.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: File list, imports, deny-list, secrets (repository content, checked on Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python check_tree.py
          python check_tree.py --positive-control
      - name: Positive control of PQ_REQUIRE_KMS (a required HSM that is missing must fail)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd tests
          if PQ_SOFTHSM_MODULE=/nonexistent python -B -m unittest test_kms_reali.TestSoftHsmReale; then
            echo "PQ_REQUIRE_KMS did not turn a missing HSM into a failure"; exit 1
          fi
      - name: Tests (against the installed package)
        shell: bash
        run: |
          cd tests
          python -c 'import pq_scitt, sys; assert "site-packages" in pq_scitt.__file__, pq_scitt.__file__; print(pq_scitt.__file__)'
          python -B -m unittest -v test_verify_ledger_full test_scitt test_anchor_slhdsa_fips205 test_kms_reali test_kms_http test_wycheproof_ed25519 test_cli test_readme_example test_strict_json 2>&1 | tee unittest.log
          # every skip with its reason, counted; POSIX sh is on every runner (Git Bash on Windows): it must not skip
          grep -o "skipped '.*'" unittest.log | sort | uniq -c || true
          if grep -q "skipped 'no POSIX sh" unittest.log; then echo "sh is missing on this runner"; exit 1; fi
          python -B test_verify_ledger.py
